name: README sample check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  readme-check:
    name: README Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify README is present and identifies the practice repo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          if not readme.is_file():
              raise SystemExit('README.md is missing')

          content = readme.read_text(encoding='utf-8')
          if not content.startswith('# git-practice'):
              raise SystemExit('README.md must begin with # git-practice')

          print('README sample check passed')
          PY
